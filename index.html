<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1320">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>커리어 코치</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root,[data-theme=dark]{--bg:#0e1320;--hdr:rgba(14,19,32,.92);--card:#161d2e;--card2:#1d2639;--line:#28324b;--ink:#e8ecf4;--sub:#8f9bb4;--acc:#3ecfb2;--on:#06221c;--acc2:#7b97ff;--warn:#f2b84b;--bad:#ef6b6b;--good:#5dd39e;--hero1:#17263d;--hero2:#14203a}
[data-theme=light]{--bg:#f3f5f9;--hdr:rgba(243,245,249,.92);--card:#ffffff;--card2:#eef1f6;--line:#dde2eb;--ink:#172033;--sub:#5d6980;--acc:#0f9c84;--on:#ffffff;--acc2:#3a5fe0;--warn:#c4850b;--bad:#d24444;--good:#1c9a5f;--hero1:#e3f4f0;--hero2:#e6ecfb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.55}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));transition:background .2s}
a{color:var(--acc2);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:8px;height:58px}
.logo{font-weight:700;font-size:17px;letter-spacing:-.3px;line-height:1.25}
.logo small{display:block;font-size:11.5px;color:var(--sub);font-weight:500}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.pill.pause{color:var(--warn)}
.pill.resume{color:var(--good);border-color:var(--good)}
.tbtn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center}
.tbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--hdr);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;padding:0 4px}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--sub)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
main{padding:16px 0 24px}
h2{font-size:19px;margin:6px 0 12px;letter-spacing:-.3px}
h3{font-size:14.5px;margin:0 0 10px;color:var(--sub);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2))}
.row{display:flex;gap:12px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:21px;letter-spacing:-.5px}
.stat span{font-size:12px;color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--acc2) 15%,transparent);color:var(--acc2)}
.tag.acc{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;background:var(--card2);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:var(--on);border-color:var(--acc)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:center}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.banner.info{background:color-mix(in srgb,var(--acc2) 10%,transparent);border:1px solid color-mix(in srgb,var(--acc2) 35%,transparent)}
.today{display:block;width:100%;text-align:left;border-radius:16px;padding:18px;margin-bottom:12px;background:var(--acc);color:var(--on);position:relative;overflow:hidden}
.today .k{font-size:12.5px;font-weight:600;opacity:.85}
.today .t{font-size:19px;font-weight:700;margin:4px 0 6px;letter-spacing:-.3px}
.today .m{font-size:13px;opacity:.85}
.today:after{content:'→';position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:700}
.today.exam{background:var(--acc2);color:#fff}
.day{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.day .n{flex:none;width:42px;text-align:center;font-size:11px;color:var(--sub);line-height:1.2}
.day .n b{display:block;font-size:17px;color:var(--ink)}
.day .b{flex:1;min-width:0}
.day .b div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .b span{font-size:12.5px;color:var(--sub)}
.day.done{opacity:.6}
.day.done .n b{color:var(--acc)}
.day.late{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.day.next{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.day.done .dot{background:var(--acc);border-color:var(--acc)}
.dot svg{width:12px;height:12px;stroke:var(--on);stroke-width:3;fill:none}
.prog{height:8px;border-radius:8px;background:var(--card2);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:8px}
.hero .prog{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.stepnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.stepnav .t{flex:1;text-align:center;font-weight:700}
.stepnav .t small{display:block;font-weight:500;color:var(--sub);font-size:12px}
.ic{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.ic:disabled{opacity:.35}
ul.pts,ol.pts{margin:6px 0 0;padding-left:18px}
ul.pts li,ol.pts li{margin:5px 0}
mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:6px}
.task{margin-top:12px;padding:12px;border-radius:10px;background:var(--card2);font-size:14px}
.links{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.lk{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:14px;color:var(--ink)}
.lk i{font-style:normal;flex:none;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;background:var(--acc2)}
.lk i.yt{background:#e33}
.lk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:8px;font-size:14.5px}
.opt.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.qn{font-size:12.5px;color:var(--sub);margin-bottom:6px}
.qt{font-size:16.5px;font-weight:650;margin-bottom:14px;line-height:1.5}
.wrong{border-left:3px solid var(--bad);background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.wrong p{margin:5px 0;font-size:14px}
.wrong .x{color:var(--bad)}
.wrong .o{color:var(--good)}
.wrong .e{font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--card2);margin-top:8px}
.brow{display:grid;grid-template-columns:1fr 110px 44px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.brow .bar{height:7px;border-radius:7px;background:var(--card2);overflow:hidden}
.brow .bar i{display:block;height:100%}
.yr{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:0 0 14px}
.yr.cur{border-left-color:var(--acc)}
.yr b{font-size:15px}
.yr ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.mrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow:last-child{border-bottom:0}
.mrow .l{flex:none;width:52px;color:var(--sub);font-size:12.5px}
.mrow .c{flex:1;min-width:0}
.act{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.act:last-child{border-bottom:0}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--acc2);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.e{align-self:center;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);font-size:13px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:160px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sub);margin:0 2px;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.on{border-color:var(--acc);color:var(--acc)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 0;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,8,15,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:680px;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin-top:0}
.close{float:right;width:32px;height:32px;border-radius:50%;background:var(--card2);font-size:16px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
.empty{text-align:center;color:var(--sub);padding:22px 10px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
svg text{font-family:inherit}
</style>

 {d:6,q:'OPC Classic(DA)이 현장에서 운영하기 까다로웠던 주된 이유는?',o:['데이터 전송 속도가 너무 느려서','Windows DCOM에 의존해 방화벽·보안 설정이 복잡해서','PLC와 통신할 수 없어서','시계열 저장 기능이 없어서'],a:1,e:'OPC Classic은 Windows DCOM 위에서 동작해 네트워크를 넘나드는 설정과 보안 관리가 어려웠습니다. OPC UA는 이를 플랫폼 독립적 통신으로 바꿨습니다.'},
 {d:7,q:'OPC UA에서 각 노드를 고유하게 식별하는 것은?',o:['TagName','NodeId','BrowsePath만으로 충분','IP 주소'],a:1,e:'NodeId가 주소공간 안에서 노드를 식별하는 고유 값입니다. BrowsePath는 이름 경로로 찾아가는 방법이지 식별자 자체가 아닙니다.'},

 {d:9,q:'OPC UA 메시지 보안 모드 중 서명과 암호화를 모두 적용하는 것은?',o:['None','Sign','SignAndEncrypt','Anonymous'],a:2,e:'SignAndEncrypt가 무결성(서명)과 기밀성(암호화)을 모두 제공합니다. Anonymous는 보안 모드가 아니라 사용자 인증 방식입니다.'},
 {d:9,q:'OPC UA에서 클라이언트·서버 애플리케이션이 서로를 신뢰하는 수단은?',o:['MAC 주소','X.509 인증서','Modbus 국번','IP 화이트리스트만 사용'],a:1,e:'애플리케이션 인증은 X.509 인증서를 교환하고 신뢰 목록에 등록하는 방식입니다. IP 제한은 보조 수단일 뿐입니다.'},
 {d:10,q:'MQTT QoS 1의 의미는?',o:['최대 1회 전달, 유실 가능','최소 1회 전달, 중복 가능','정확히 1회 전달','전달 확인 없음'],a:1,e:'QoS 1은 수신 확인을 받을 때까지 재전송하므로 최소 한 번은 전달되지만 중복될 수 있습니다. 정확히 1회는 QoS 2입니다.'},
 {d:10,q:'MQTT Last Will 메시지의 역할은?',o:['브로커가 종료될 때 모든 구독자에게 발송','클라이언트가 비정상적으로 끊기면 브로커가 미리 등록된 메시지를 발행','마지막으로 발행된 값을 보관','가장 오래된 메시지를 삭제'],a:1,e:'Last Will은 연결 시 등록해 두는 메시지로, 클라이언트가 비정상 종료되면 브로커가 대신 발행합니다. 설비 통신 상태 감시에 씁니다. 마지막 값 보관은 Retain입니다.'},
 {d:10,q:'MQTT에서 발행자와 구독자의 관계로 맞는 것은?',o:['서로 IP를 알고 직접 연결해야 한다','브로커를 통해 연결되며 서로를 몰라도 된다','구독자가 발행자에게 주기적으로 요청한다','1:1로만 통신할 수 있다'],a:1,e:'MQTT는 브로커가 중개하는 발행/구독 구조라 발행자와 구독자가 분리됩니다. 그래서 다대다 연결이 쉽습니다.'},
 {d:11,q:'UNS(Unified Namespace)를 도입하는 주된 목적은?',o:['PLC 스캔 시간 단축','시스템 간 1:1 연동을 줄이고 공통 네임스페이스로 실시간 데이터를 공유','Historian 압축률 향상','OPC UA 인증서 관리 자동화'],a:1,e:'UNS는 모든 시스템이 하나의 계층형 네임스페이스에 데이터를 올리고 필요한 쪽이 구독하는 구조입니다. 시스템이 늘어도 연동 수가 폭증하지 않습니다.'},
 {d:12,q:'진동 원시 파형을 엣지에서 RMS·피크 같은 특징값으로 바꿔 보내는 주된 이유는?',o:['센서 수명을 늘리기 위해','전송·저장량을 줄이고 현장에서 빠르게 판단하기 위해','OPC UA 보안 요구사항 때문에','PLC 프로그램을 단순화하기 위해'],a:1,e:'수 kHz 원시 파형을 모두 보내면 네트워크와 저장 부담이 큽니다. 엣지에서 특징값으로 줄이면 부담이 줄고 판단 지연도 짧아집니다. 정밀 진단용 원시 파형은 이벤트 시에만 보내는 구성이 흔합니다.'},
 {d:13,q:'4~20mA 신호에서 0점을 4mA로 두는 이유는?',o:['전력 소비를 줄이기 위해','단선(0mA)과 측정값 0을 구분하기 위해','노이즈를 증폭하기 위해','디지털 통신과 호환되기 위해'],a:1,e:'0점을 4mA로 두면 0mA는 단선·고장으로 판단할 수 있습니다. 이를 live zero라고 합니다.'},
 {d:13,q:'RTD와 열전대를 비교한 설명으로 맞는 것은?',o:['RTD가 더 높은 온도까지 측정한다','열전대가 일반적으로 더 정밀하고 안정적이다','RTD는 정밀·안정성이 좋고, 열전대는 고온·넓은 범위에 유리하다','둘은 측정 원리가 같다'],a:2,e:'RTD는 저항 변화를 이용해 정밀하고 안정적이며, 열전대는 두 금속 접점의 기전력을 이용해 고온과 넓은 범위에 강합니다.'},
 {d:15,q:'관심 최고 주파수가 1kHz일 때, 나이퀴스트 이론상 샘플링 주파수 조건은?',o:['500Hz 이상','1kHz 이상','2kHz 초과','10kHz 이상'],a:2,e:'최고 주파수의 2배를 넘어야 앨리어싱 없이 복원할 수 있습니다. 실무에서는 필터 특성을 고려해 2.56배(약 2.56kHz) 이상을 많이 씁니다.'},
 {d:15,q:'1초 주기로 저장된 RTDB 데이터로 베어링 결함 주파수를 분석하려 할 때의 문제는?',o:['데이터가 너무 많아 분석이 느리다','샘플링이 부족해 고주파 정보가 없다','타임스탬프가 없어 분석할 수 없다','RTDB는 진동 데이터를 저장할 수 없다'],a:1,e:'1초 주기(1Hz) 데이터는 0.5Hz 이하 성분만 담을 수 있습니다. 수백 Hz~kHz대 결함 주파수는 전용 고속 수집이 필요합니다. 추세 감시에는 1초 데이터도 쓸모가 있습니다.'},
 {d:16,q:'서로 다른 시스템의 데이터를 합쳐 분석할 때 가장 먼저 확인할 것은?',o:['태그 이름의 길이','타임스탬프 동기화(시계 오차·시간대)','데이터 파일 형식','그래프 색상'],a:1,e:'시간이 어긋나면 원인과 결과의 순서가 뒤바뀌어 보일 수 있습니다. 시스템 시계 오차와 시간대(UTC/로컬)부터 맞춰야 합니다.'},
 {d:17,q:'사업장 간 태그 명명 규칙을 표준화하는 가장 큰 이유는?',o:['화면 디자인 통일','같은 분석 모델을 다른 사업장에 재사용(횡전개)하기 위해','PLC 메모리 절약','네트워크 속도 향상'],a:1,e:'태그 이름과 메타데이터가 표준화되어 있으면 한 사업장에서 만든 모델과 대시보드를 다른 사업장에 바로 적용할 수 있습니다. 횡전개 속도를 결정하는 요소입니다.'}

const P=s=>new Date(s+'T00:00:00');

function toWd(d){while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return d}
function addWd(s,n){const d=toWd(P(s));while(n>0){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)n--}return ymd(d)}

  ${m.items.length?`<h3>일별 학습</h3>${m.items.map((_,k)=>dayRow(m,k,md_.m)).join('')}`:''}`}

 if(m.key&&m.key.length)return `<details class="card"><summary>핵심 요약 · 복습용 (${m.key.length}) <span class="muted" style="font-weight:500">— 눌러서 펼치기</span></summary><ol class="pts" style="font-size:14px">${m.key.map(k=>`<li>${esc(k)}</li>`).join('')}</ol><div style="margin-top:10px"><button class="btn sm ghost" data-act="review" data-m="${i}">복습 화면으로</button></div></details>`;

function snip(t,i,n){const a=Math.max(0,i-24),z=Math.min(t.length,i+n+40);return (a>0?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+n))+'</mark>'+esc(t.slice(i+n,z))+(z<t.length?'…':'')}
function searchHTML(q){q=(q||'').trim().toLowerCase();
 if(!q)return '<div class="empty">학습 제목, 핵심 내용, 실습 과제, 내 메모, 핵심 요약에서 찾습니다.</div>';
 const out=[],hit=t=>{t=String(t||'');const i=t.toLowerCase().indexOf(q);return i<0?null:snip(t,i,q.length)};
 S.months.forEach((m,mi)=>{
  (m.key||[]).forEach(k=>{const h=hit(k);if(h)out.push({h,head:`${m.ym} ${m.theme} · 핵심 요약`,lab:'',act:`data-act="review" data-m="${mi}"`})});
  m.items.forEach((it,k)=>{for(const[lab,t]of[['제목',it.title],...it.summary.map(x=>['핵심',x]),['실습',it.task],['내 메모',it.memo]]){const h=hit(t);if(h){out.push({h,head:`${m.ym} · Day ${k+1} ${it.title}`,lab,act:`data-act="open" data-m="${mi}" data-k="${k}"`,done:it.done});break}}})});
 if(!out.length)return '<div class="empty">찾는 내용이 없습니다.</div>';
 return `<div class="muted" style="margin-bottom:8px">${out.length}건</div>`+out.slice(0,60).map(r=>`<button class="day" ${r.act}><div class="b"><div>${esc(r.head)}</div><span>${r.lab?r.lab+' · ':''}${r.h}</span></div>${r.done?'<span class="tag acc">학습함</span>':''}</button>`).join('')}

function md(s){let h=esc(s);h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/^#{1,4} (.+)$/gm,'<b>$1</b>').replace(/^[-*] /gm,'• ').replace(/\n/g,'<br>');return h}

function setPath(path,val){const ks=path.split('.');let o=S;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks.at(-1)]=val}

/* ======================= AI ======================= */
const SYS=`너는 엔지니어 한 명의 학습 튜터다. 이 사람은 50세 전후로 공정개발·제조·설비기술·인프라를 거쳐 제조공장 인프라 그룹장이며, 공장에 Physical AI(예지보전·에너지 최적화)를 자체 기술로 도입해 왔다. 목표는 제조·유틸리티 Physical AI 도입 설계자(컨설턴트 또는 사업가)다.
규칙: 평이한 비즈니스 한국어로 짧고 구체적으로. 과장·자기계발서식 표현 금지. 현장 설비 비유를 쓰되 기술 용어는 정확히. 회사 기밀 수치는 요구하지 않는다. 링크는 확실한 공식 사이트만, 불확실하면 검색어로 제시.`;
function ctx(){const m=M(S.cur),k=nextItem(m),it=m.items[k>=0?k:m.items.length-1];return `[현재 테마] ${m.ym} ${m.theme} — ${m.goal}\n[진도] ${doneCnt(m)}/${m.items.length}일\n${it?`[현재 학습] Day ${m.items.indexOf(it)+1} ${it.title}: ${it.summary.join(' / ')}`:''}\n[지난 테마 시험] ${S.months.slice(0,S.cur).map(x=>`${x.ym} ${best(x)??'-'}점`).join(', ')||'없음'}`}
async function callAI(system,messages,maxTok=2000){
 const p=S.set.provider,key=(S.set.keys[p]||'').trim(),model=(S.set.models[p]||'').trim();
 if(!key)throw new Error('API 키가 없습니다. [설정]에서 입력하세요.');
 let res,j;
 if(p==='claude'){res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:maxTok,system,messages})});j=await res.json();if(!res.ok)throw new Error(j.error?.message||res.status);return (j.content||[]).map(c=>c.text||'').join('')}
 if(p==='openai'){res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'system',content:system},...messages]})});j=await res.json();if(!res.ok)throw new Error(j.error?.message||res.status);return j.choices?.[0]?.message?.content||''}
 res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:messages.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]})),generationConfig:{maxOutputTokens:maxTok}})});j=await res.json();if(!res.ok)throw new Error(j.error?.message||res.status);return (j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('')}
function arr(t){const a=t.indexOf('['),b=t.lastIndexOf(']');if(a<0||b<a)throw new Error('응답 형식을 읽지 못했습니다. 다시 시도하세요.');return JSON.parse(t.slice(a,b+1))}
async function ask(text,show=text){if(ui.busy)return;S.tab='ai';S.chat.push({r:'user',c:show});ui.busy=true;render();
 const h=S.chat.filter(m=>m.r!=='err').slice(-12).map(m=>({role:m.r==='user'?'user':'assistant',content:m.c}));h[h.length-1].content=text;
 try{S.chat.push({r:'assistant',c:await callAI(SYS+'\n\n'+ctx(),h)||'(응답 없음)'})}catch(e){S.chat.push({r:'err',c:'오류: '+e.message})}
 if(S.chat.length>60)S.chat=S.chat.slice(-60);ui.busy=false;save();render()}
async function genCurriculum(mi,src){if(ui.busy)return;const m=M(mi);ui.busy=true;toast('커리큘럼 생성 중… 30초 정도 걸립니다');render();
 const prev=S.months.slice(0,mi).filter(x=>x.attempts.length).slice(-1)[0];let weak='';
 if(prev){const a=prev.attempts.at(-1);const w=a.qs.filter((q,j)=>a.ans[j]!==q.a).map(q=>(prev.items[q.d]||{}).title).filter(Boolean);weak=[...new Set(w)].join(', ')}
 const p=(src?`다음 텍스트를 일별 학습 항목으로 정리하라. 내용을 임의로 바꾸지 말고 구조만 맞춘다.\n---\n${src}\n---\n`:`월 테마 '${m.theme}'(목표: ${m.goal})로 평일 20일 학습 커리큘럼을 만들어라. 하루 30~45분. 5일마다 주간 정리 1일 포함. 마지막 2일은 실행형(정리·적용). ${weak?`지난 시험 약점(${weak})과 연결되는 내용을 초반에 반영.`:''}\n`)+'출력은 JSON 배열만: [{"title":"제목","summary":["핵심 문장 3~5개, 정확한 기술 내용"],"task":"현장 연결 실습 또는 생각할 질문","video":"YouTube 검색어","links":[{"t":"이름","u":"공식 문서 URL"}],"min":40}] — links는 표준기구·제조사·공식 프로젝트 사이트처럼 확실한 것만, 불확실하면 빈 배열. 모든 내용은 한국어로 쓴다. video 검색어는 한국어로 쓰고, 한국어 영상이 드문 주제만 영문 용어를 병기한다. 링크는 한국어 자료를 우선하고, 영문 자료는 t 끝에 " · 영문"을 붙인다.';

async function genBank(mi){const m=M(mi);const body=m.items.map((it,k)=>`Day ${k} ${it.title}: ${it.summary.join(' / ')}`).join('\n');
 const p=`아래 ${m.items.length}일 학습 내용으로 객관식 25문항을 만들어라. 각 4지선다, 정답 1개. 개념 확인 60%, 현장 적용 판단 40%. 실행형(정리·적용) 일차는 출제하지 않아도 된다. 해설은 2~3문장으로 정답 이유와 헷갈리기 쉬운 오답이 왜 틀렸는지 포함. d는 출제 근거 일차 번호(0부터).\n출력은 JSON 배열만: [{"d":0,"q":"문제","o":["보기1","보기2","보기3","보기4"],"a":0,"e":"해설"}]\n---\n${body}`;
 const list=arr(await callAI(SYS,[{role:'user',content:p}],10000)).filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length===4&&x.a>=0&&x.a<4);if(list.length<10)throw new Error('문항이 부족합니다');m.bank=list.map(x=>({...x,d:Math.max(0,Math.min(m.items.length-1,+x.d||0))}))}
async function genKey(mi){const m=M(mi);if(!m.items.length)return;const body=m.items.map((it,k)=>`Day ${k+1} ${it.title}: ${it.summary.join(' / ')}`).join('\n');
 const p=`아래 '${m.theme}' 과정을 수료한 사람이 복습할 때 가장 중요하게 기억해야 할 핵심 요약을 8~10개 항목으로 정리하라. 각 항목은 한국어 1~2문장으로, 구체적인 기술 내용과 현장 판단 기준을 담는다. 마지막 항목은 "컨설턴트 관점 한 줄:"로 시작한다. 출력은 JSON 문자열 배열만.\n---\n${body}`;
 const list=arr(await callAI(SYS,[{role:'user',content:p}],2500)).filter(x=>typeof x==='string'&&x.trim());if(!list.length)throw new Error('요약이 비어 있습니다');m.key=list}

 try{const b='https://www.gstatic.com/firebasejs/10.12.2/';if(typeof firebase==='undefined'){await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-firestore-compat.js')}
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);FB.auth=app.auth();FB.db=app.firestore();
  FB.auth.onAuthStateChanged(u=>{ui.user=u;if(u)startSync(u).catch(e=>{ui.fbState='오류: '+e.message;render()});else{stopSync();ui.fbState='로그인 필요'}render()});
 }catch(e){ui.fbState='오류: '+e.message;render()}}
function assemble(snap){let meta=null;const ms=[];snap.forEach(d=>{const x=d.data();if(d.id==='meta')meta=x;else if(/^m\d+$/.test(d.id))ms[+d.id.slice(1)]=x});
 if(!meta)return null;const mo=JSON.parse(meta.json),n=mo.monthCount||ms.length;delete mo.monthCount;
 const months=[];for(let i=0;i<n;i++){if(!ms[i])return null;months.push(JSON.parse(ms[i].json))}
 const pushed={meta:meta.json};ms.forEach((x,i)=>{if(x)pushed['m'+i]=x.json});
 return{data:{...mo,months},updatedAt:meta.updatedAt||0,device:meta.device,pushed}}
function applyRemote(r){S={...r.data,set:S.set,theme:S.theme,tab:S.tab,view:null,syncUid:ui.user.uid,updatedAt:r.updatedAt};FB.pushed=r.pushed;ui.lastPayload=payloadStr();
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}ui.exam=null;ui.result=null;ui.modal=null;ui.lastSync=Date.now()}
async function startSync(u){ui.fbState='동기화 중';render();FB.col=FB.db.collection('users').doc(u.uid).collection('career');
 const r=assemble(await FB.col.get());
 if(!r){S.syncUid=u.uid;await push(true)}
 else if(S.syncUid===u.uid){if(r.updatedAt>(S.updatedAt||0))applyRemote(r);else{FB.pushed=r.pushed;if((S.updatedAt||0)>r.updatedAt)await push(true)}}
 else{const ft=t=>t?new Date(t).toLocaleString('ko-KR'):'없음';
  if(!(S.updatedAt>0)||confirm(`클라우드에 저장된 기록(${ft(r.updatedAt)})이 있습니다.\n[확인] 클라우드 기록을 이 기기로 가져오기\n[취소] 이 기기 기록(${ft(S.updatedAt)})으로 클라우드 덮어쓰기`))applyRemote(r);
  else{S.syncUid=u.uid;FB.pushed=r.pushed;await push(true)}}
 S.syncUid=u.uid;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 ui.syncReady=true;ui.fbState='동기화 켜짐';ui.lastSync=ui.lastSync||Date.now();
 if(FB.unsub)FB.unsub();
 FB.unsub=FB.col.onSnapshot(sn=>{if(sn.metadata.hasPendingWrites)return;const x=assemble(sn);if(x&&x.updatedAt>(S.updatedAt||0)&&x.device!==DEVICE){applyRemote(x);render();toast('다른 기기의 기록을 반영했습니다')}},e=>{ui.fbState='오류: '+e.message;render()});
 render()}
function stopSync(){if(FB.unsub)FB.unsub();FB.unsub=null;ui.syncReady=false;FB.col=null}
function schedulePush(){if(!ui.syncReady)return;clearTimeout(FB.timer);FB.timer=setTimeout(()=>push().catch(e=>{ui.fbState='저장 실패: '+e.message;if(S.tab==='set')render()}),1500)}
async function push(force){if(!FB.col||(!ui.syncReady&&!force))return;const p=payloadObj(),docs={meta:JSON.stringify({...p.meta,monthCount:p.months.length})};p.months.forEach((m,i)=>docs['m'+i]=JSON.stringify(m));
 const ch=Object.keys(docs).filter(k=>docs[k]!==FB.pushed[k]);if(!ch.length)return;if(!ch.includes('meta'))ch.push('meta');
 if(!S.updatedAt)S.updatedAt=Date.now();const t=S.updatedAt,b=FB.db.batch();
 ch.forEach(k=>b.set(FB.col.doc(k),k==='meta'?{json:docs.meta,updatedAt:t,device:DEVICE}:{json:docs[k],updatedAt:t}));
 await b.commit();ch.forEach(k=>FB.pushed[k]=docs[k]);ui.lastSync=Date.now();ui.fbState='동기화 켜짐';if(S.tab==='set')render()}
function vSync(){const cfg=fbCfg();
 const rules=`<details style="margin-top:12px"><summary class="muted">Firestore 보안 규칙 (필수)</summary><pre style="white-space:pre-wrap;font-size:12px;background:var(--card2);padding:10px;border-radius:8px;margin:8px 0 0">match /users/{uid}/career/{doc} {\n  allow read, write: if request.auth != null\n    && request.auth.uid == uid;\n}</pre><div class="muted" style="margin-top:6px">기존 규칙의 documents 블록 안에 추가하세요. 로그인한 사용자 전체에 열린 와일드카드 규칙이 있으면 이 기록을 다른 사용자도 볼 수 있으니 함께 확인하세요. Authentication에서 Google 로그인 사용, 승인된 도메인에 woosuly.github.io가 있어야 합니다.</div></details>`;
 if(!cfg)return `<div class="card"><h3>클라우드 동기화 (Firebase)</h3><div class="muted">휴대폰·PC 기록을 맞추려면 Firebase 웹 앱 설정(firebaseConfig)을 붙여넣으세요. 이 기기에만 저장됩니다.</div><textarea id="fbcfg" style="margin-top:10px;min-height:110px;font-size:12.5px" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, authDomain: &quot;…&quot;, projectId: &quot;…&quot;, … }"></textarea><div class="btns" style="margin-top:10px"><button class="btn pri" data-act="fbsave">저장하고 연결</button></div>${rules}</div>`;
 return `<div class="card"><h3>클라우드 동기화 (Firebase)</h3><div class="kv"><span>프로젝트</span><span>${esc(cfg.projectId)}</span></div><div class="kv"><span>상태</span><span>${esc(ui.fbState||'준비 중')}</span></div>${ui.user?`<div class="kv"><span>계정</span><span>${esc(ui.user.email||'')}</span></div><div class="kv"><span>마지막 동기화</span><span>${ui.lastSync?new Date(ui.lastSync).toLocaleString('ko-KR'):'–'}</span></div>`:''}
 <div class="muted" style="margin-top:8px">학습 기록·시험·이력이 동기화됩니다. AI API 키와 화면 모드는 기기별로 따로 둡니다.</div>
 <div class="btns" style="margin-top:12px">${ui.user?'<button class="btn" data-act="fbsync">지금 동기화</button><button class="btn ghost" data-act="fblogout">로그아웃</button>':`<button class="btn pri" data-act="fblogin" ${FB.auth?'':'disabled'}>Google로 로그인</button>`}${FB_CONFIG?'':'<button class="btn ghost danger" data-act="fbclear">설정 해제</button>'}</div>${rules}</div>`}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('online',()=>push().catch(()=>{}));

let tx=null,ty=null;
document.addEventListener('touchstart',e=>{tx=null;if(ui.modal&&ui.modal.t==='item'&&e.target.closest('.sheet')&&!e.target.closest('textarea,input,a')){tx=e.touches[0].clientX;ty=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null||!ui.modal||ui.modal.t!=='item')return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)<70||Math.abs(dy)>50)return;
 const m=M(ui.modal.m),k=ui.modal.k+(dx<0?1:-1);if(k<0||k>=m.items.length)return;ui.modal={t:'item',m:ui.modal.m,k};render();const sh=document.querySelector('.sheet');if(sh)sh.scrollTop=0},{passive:true});
if(typeof navigator!=='undefined'&&navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{ui.persist=!!p;if(S.tab==='set')render()}).catch(()=>{ui.persist=false})}else ui.persist=false;
render();
fbBoot();
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
